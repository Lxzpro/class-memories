<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>重置拾光簿密码</title>
  </head>
  <body style="margin:0;background:#f6f4ef;color:#243443;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f6f4ef;padding:32px 16px;">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fffdf9;border:1px solid #ebe8e0;border-radius:24px;box-shadow:0 14px 40px rgba(52,65,73,.08);">
          <tr><td style="padding:42px 38px 36px;">
            <p style="margin:0 0 14px;color:#6e9eea;font-size:12px;font-weight:700;letter-spacing:.18em;">OUR CLASS ARCHIVE</p>
            <h1 style="margin:0 0 22px;color:#1f3449;font-family:'Songti SC','STSong','Noto Serif SC',serif;font-size:30px;font-weight:600;line-height:1.4;">重新设置你的相册密码</h1>
            <p style="margin:0 0 14px;color:#56636d;font-size:16px;line-height:1.85;">你好，</p>
            <p style="margin:0 0 26px;color:#56636d;font-size:16px;line-height:1.85;">我们收到了重置“拾光簿”访问密码的请求。点击下面的按钮，即可为你的班级相册设置一个新密码。</p>
            <table role="presentation" cellspacing="0" cellpadding="0" style="margin:0 0 28px;"><tr><td style="border-radius:999px;background:#4f91e8;"><a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;padding:14px 28px;color:#ffffff;font-size:16px;font-weight:700;text-decoration:none;">设置新密码</a></td></tr></table>
            <div style="margin:0 0 24px;padding:17px 18px;border-radius:14px;background:#f2f5ec;color:#65715e;font-size:14px;line-height:1.8;">为了保护班级照片，请不要把这封邮件或重置链接转发给其他人。链接失效后，可返回网站重新申请。</div>
            <p style="margin:0;color:#7b858c;font-size:14px;line-height:1.8;">如果这不是你的操作，可以放心忽略本邮件，你原来的密码不会被修改。</p>
          </td></tr>
          <tr><td style="padding:20px 38px;border-top:1px solid #efede7;color:#9a9fa2;font-size:12px;line-height:1.7;">拾光簿 · 不按时间，只按记忆。</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
